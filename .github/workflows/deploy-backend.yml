name: Deploy GEO Backend to Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend jar
        working-directory: jeecg-boot
        run: mvn -pl jeecg-module-system/jeecg-system-start -am package -DskipTests

      - name: Prepare deploy directory
        shell: bash
        run: |
          mkdir -p deploy/geo/init-sql deploy/geo/config
          cp jeecg-boot/jeecg-module-system/jeecg-system-start/target/jeecg-system-start-3.9.3.jar deploy/geo/jeecg-system-start-3.9.3.jar

      - name: Create server deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: mkdir -p ${{ vars.SERVER_PATH }}

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "deploy/geo/*"
          target: ${{ vars.SERVER_PATH }}

      - name: Build image and start containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          envs: SERVER_PATH,GEO_API_URL,GEO_API_DOMAIN,GEO_ENABLE_PROXY,BACKEND_PORT,GEO_SITE_BASEURL,GEO_SITE_SITENAME,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,REDIS_PASSWORD,GEO_AI_APIKEY,GEO_AI_BASEURL,GEO_AI_MODEL,WECHATSYNC_TOKEN,SYNC_WS_PORT
          script: |
            set -e
            cd "$SERVER_PATH"
            printf '%s\n' \
              "GEO_API_URL=$GEO_API_URL" \
              "GEO_API_DOMAIN=$GEO_API_DOMAIN" \
              "BACKEND_PORT=$BACKEND_PORT" \
              "BACKEND_IMAGE=jeecg-geo-backend:local" \
              "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
              "MYSQL_DATABASE=$MYSQL_DATABASE" \
              "MYSQL_USER=$MYSQL_USER" \
              "MYSQL_PASSWORD=$MYSQL_PASSWORD" \
              "REDIS_PASSWORD=$REDIS_PASSWORD" \
              "GEO_AI_APIKEY=$GEO_AI_APIKEY" \
              "GEO_AI_BASEURL=$GEO_AI_BASEURL" \
              "GEO_AI_MODEL=$GEO_AI_MODEL" \
              "GEO_SITE_BASEURL=$GEO_SITE_BASEURL" \
              "GEO_SITE_SITENAME=$GEO_SITE_SITENAME" \
              "WECHATSYNC_TOKEN=$WECHATSYNC_TOKEN" \
              "SYNC_WS_PORT=$SYNC_WS_PORT" \
              "GEO_ENABLE_PROXY=$GEO_ENABLE_PROXY" \
              > .env
            docker build -f backend.Dockerfile -t jeecg-geo-backend:local .
            if [ "$GEO_ENABLE_PROXY" = "true" ]; then
              docker compose -f docker-compose.prod.yml --profile proxy up -d
            else
              docker compose -f docker-compose.prod.yml up -d
            fi
            docker compose -f docker-compose.prod.yml ps
