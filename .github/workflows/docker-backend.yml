name: Build GEO Backend Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend jar
        working-directory: jeecg-boot
        run: mvn -pl jeecg-module-system/jeecg-system-start -am package -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: jeecg-boot/jeecg-module-system/jeecg-system-start
          file: jeecg-boot/jeecg-module-system/jeecg-system-start/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jeecg-geo-backend:latest
            ghcr.io/${{ github.repository_owner }}/jeecg-geo-backend:${{ github.ref_name }}
